<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed (no rounded outer corners — OS mask handles that). No <text>. -->
  <defs>
    <linearGradient id="g" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0a0913"/>
  <!-- Back card -->
  <g transform="rotate(-10 256 256)">
    <rect x="146" y="108" width="220" height="296" rx="32" fill="none" stroke="url(#g)" stroke-width="18" opacity="0.5"/>
  </g>
  <!-- Front card -->
  <g transform="rotate(7 256 256)">
    <rect x="156" y="118" width="220" height="296" rx="32" fill="#14111f" stroke="url(#g)" stroke-width="18"/>
  </g>
  <!-- Bold ? mark — readable at favicon size -->
  <path
    fill="none"
    stroke="url(#g)"
    stroke-width="36"
    stroke-linecap="round"
    d="M208 200c0-44 36-72 72-72s72 28 72 68c0 36-24 52-48 66-20 12-32 24-32 52"
  />
  <circle cx="272" cy="348" r="18" fill="url(#g)"/>
</svg>
